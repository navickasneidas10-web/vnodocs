<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VNO FIDS</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,300..800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Open Sans',sans-serif;color:#fff}
body.op{overflow:auto;background:#101010}
*{box-sizing:border-box}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#000;font-stretch:90%;font-weight:700}
/* dvikalbis tekstas + slinkimas */
.bi{position:relative;width:100%;height:1.32em;overflow:hidden;white-space:nowrap}
.layer{position:absolute;inset:0;display:flex;align-items:center;opacity:1;transition:opacity .45s ease .45s}
.layer.hide{opacity:0;transition:opacity .45s ease 0s}
.mq{display:inline-block;white-space:nowrap;flex-shrink:0}
@keyframes mq{0%,10%{transform:translateX(0)}90%,100%{transform:translateX(var(--d))}}
/* lentos eilutės */
.frow{position:absolute;background:#000}
.fcell{position:absolute;top:0;bottom:0;display:flex;align-items:center}
.fstat{position:absolute;background:#2b2b2b;border-radius:8px;display:flex;align-items:center;padding:0 12px}
.fstat.y{background:#ffc20e}
.fstat.r{background:#c8102e}
.fhead{position:absolute;background:#000;border-radius:6px}
.fsep{position:absolute;display:flex;align-items:center;color:#ff9f1c}
/* operatorius */
.op-wrap{font-family:'Open Sans',sans-serif;color:#e8e8e8;padding:16px 20px;max-width:1600px;margin:0 auto;font-size:14px}
.op-wrap h2{margin:0 0 12px;font-size:20px}
.op-wrap h3{margin:0 0 10px;font-size:16px;color:#ffc20e}
.op-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:#1c1c1c;border:1px solid #333;color:#ccc;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.tabs button.on{background:#ffc20e;color:#111;border-color:#ffc20e;font-weight:700}
.badge{font-size:12px;padding:3px 8px;border-radius:20px;background:#263;color:#bfe}
.badge.loc{background:#552;color:#ffd}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:#9aa;font-weight:600;padding:6px 4px;border-bottom:1px solid #333;background:#101010;position:sticky;top:0;z-index:1}
.tbl td{padding:4px;border-bottom:1px solid #222;vertical-align:middle}
.tbl tr.past td{opacity:.45}
.op-wrap input,.op-wrap select{background:#1d1d1d;border:1px solid #3a3a3a;color:#eee;border-radius:5px;padding:5px 6px;font:inherit;font-size:13px}
.op-wrap input[type=checkbox]{width:16px;height:16px}
.btn{background:#2a2a2a;border:1px solid #444;color:#eee;border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#777}
.btn.pri{background:#ffc20e;color:#111;border-color:#ffc20e;font-weight:700}
.btn.dirty{background:#ffc20e;color:#000;font-weight:700}
.btn.del{color:#ff7b7b}
.chip{font-size:11px;padding:3px 6px;margin:1px;border-radius:4px;border:1px solid #444;background:#222;color:#ccc;cursor:pointer}
.chip.on{background:#ffc20e;color:#000;border-color:#ffc20e}
.card{background:#171717;border:1px solid #2a2a2a;border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.lnk{color:#7cc4ff;text-decoration:none}
.lnk:hover{text-decoration:underline}
.muted{color:#888;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.home{padding:40px;font-family:'Open Sans',sans-serif;color:#eee;overflow:auto;height:100%}
.home a{display:inline-block;margin:4px 6px 4px 0;padding:8px 12px;border:1px solid #333;border-radius:8px;color:#fff;text-decoration:none;background:#1a1a1a}
.home a:hover{border-color:#ffc20e}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useLayoutEffect,useCallback}=React;

/* =========================================================
   1. KONFIGŪRACIJA
   Įrašyk savo Supabase duomenis čia (arba operatoriaus
   pultelyje → Nustatymai). Jei tušti – veikia vietinis
   demo režimas (localStorage, sinchronizacija tarp skirtukų).
   ========================================================= */
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';

const TZ='Europe/Vilnius';
const LANG_MS=25000;   // kalbos keitimo intervalas (ms)
const MQ_PASSES=3;     // kiek kartų netelpantis tekstas praslenka per vieną kalbos ciklą (daugiau = greičiau)
const Y='#ffc20e';

/* =========================================================
   2. LAIKAS
   ========================================================= */
const pad=n=>String(n).padStart(2,'0');
const toMin=s=>{ if(!s) return null; const m=String(s).match(/(\d{1,2}):(\d{2})/); return m?(+m[1])*60+(+m[2]):null; };
const fromMin=m=>{ m=((Math.round(m)%1440)+1440)%1440; return pad(Math.floor(m/60))+':'+pad(m%60); };
const dParse=s=>{ const [y,mo,d]=String(s).slice(0,10).split('-').map(Number); return Date.UTC(y,mo-1,d); };
const dayDiff=(a,b)=>Math.round((dParse(b)-dParse(a))/864e5);
const addDays=(s,n)=>new Date(dParse(s)+n*864e5).toISOString().slice(0,10);
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)}));
const _fmt=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function vnow(){ const p={}; _fmt.formatToParts(new Date()).forEach(x=>p[x.type]=x.value); const h=+p.hour%24,m=+p.minute; return {date:`${p.year}-${p.month}-${p.day}`,h,m,s:+p.second,mins:h*60+m}; }

/* Bendri laikmačiai – visi ekranai persijungia sinchroniškai pagal laikrodį */
const tickers={};
function getTicker(period){
  if(!tickers[period]){
    const t={v:Math.floor(Date.now()/period),ls:new Set()};
    setInterval(()=>{const v=Math.floor(Date.now()/period); if(v!==t.v){t.v=v; t.ls.forEach(l=>l());}},100);
    tickers[period]=t;
  }
  return tickers[period];
}
function useTicker(period){
  const t=getTicker(period); const [,f]=useState(0);
  useEffect(()=>{const l=()=>f(x=>x+1); t.ls.add(l); return ()=>t.ls.delete(l);},[t]);
  return t.v;
}

/* =========================================================
   3. BŪSENOS
   ========================================================= */
const STATUSES=[
  ['scheduled','—','—'],
  ['checkin_soon','REGISTRACIJA PRADEDAMA {t}','CHECK-IN OPENS {t}'],
  ['checkin','REGISTRUOJAMA','CHECK-IN'],
  ['checkin_closed','REGISTRACIJA BAIGTA','CHECK-IN CLOSED'],
  ['delayed','VĖLUOJA','DELAYED'],
  ['gate_open','VARTAI ATIDARYTI','GATE OPEN'],
  ['boarding','LAIPINAMA','BOARDING'],
  ['final_call','PASK. KVIETIMAS','FINAL CALL'],
  ['gate_closed','VARTAI UŽDARYTI','GATE CLOSED'],
  ['gate_change','PAKEISTI VARTAI','GATE CHANGE'],
  ['departed','IŠSKRIDO {t}','DEPARTED {t}'],
  ['cancelled','ATŠAUKTAS','CANCELLED'],
];
const ST=Object.fromEntries(STATUSES.map(([k,lt,en])=>[k,{k,lt,en}]));
const HL={final_call:'y',gate_change:'y',cancelled:'r'};
const GATE_PHASE=new Set(['gate_open','boarding','final_call','gate_closed','gate_change']);
const DESK_PHASE=new Set(['checkin_soon','checkin','checkin_closed','delayed']);

function statusLabel(f){
  if(!f||!f.status||f.status==='scheduled') return null;
  const s=ST[f.status]; if(!s) return null;
  const t=f.stime||'';
  return {lt:s.lt.replace('{t}',t).trim(),en:s.en.replace('{t}',t).trim(),hl:HL[f.status]||''};
}

/* Automatinis būsenų režimas (minutės iki išvykimo) */
/* openRel – registracijos pradžia (minutės nuo šiandienos 00:00), jei nurodyta „Registracija nuo“ */
function autoStatus(dt,relEff,openRel,nowM){
  if(openRel!=null){
    if(nowM<openRel) return (openRel-nowM>1440)?{s:'scheduled',t:null}:{s:'checkin_soon',t:fromMin(openRel)};
    if(dt>40) return {s:'checkin',t:null};
  } else {
    if(dt>1440) return {s:'scheduled',t:null};
    if(dt>150) return {s:'checkin_soon',t:fromMin(relEff-150)};
    if(dt>40) return {s:'checkin',t:null};
  }
  if(dt>30) return {s:'gate_open',t:null};
  if(dt>15) return {s:'boarding',t:null};
  if(dt>10) return {s:'final_call',t:null};
  if(dt>0) return {s:'gate_closed',t:null};
  return {s:'departed',t:fromMin(relEff)};
}

function expandList(s){
  const out=[];
  String(s||'').split(/[,;\s]+/).filter(Boolean).forEach(tok=>{
    const m=tok.match(/^([A-Za-z]*)(\d+)-([A-Za-z]*)(\d+)$/);
    if(m){const a=+m[2],b=+m[4]; for(let i=Math.min(a,b);i<=Math.max(a,b);i++) out.push((m[1]||m[3]||'').toUpperCase()+i);}
    else out.push(tok.toUpperCase());
  });
  return out;
}

/* =========================================================
   4. DUOMENYS (Supabase arba vietinis režimas)
   ========================================================= */
const DEST_SEED=[
  ['HEL','Helsinkis','Helsinki',2],['BER','Berlynas','Berlin',6],['BUD','Budapeštas','Budapest',8],
  ['SSH','Šarm aš Šeichas','Sharm El Sheikh',27],['LCA','Larnaka','Larnaca',22],['OSL','Oslas','Oslo',1],
  ['IST','Stambulas','Istanbul',15],['HRG','Hurgada','Hurghada',24],['RIX','Ryga','Riga',4],
  ['AYT','Antalija','Antalya',21],['ATH','Atėnai','Athens',18],['ZRH','Ciurichas','Zurich',7],
  ['BCN','Barselona','Barcelona',17],['LTN','Londonas','London',10],['STN','Londonas','London',10],
  ['FRA','Frankfurtas','Frankfurt',8],['WAW','Varšuva','Warsaw',5],['CPH','Kopenhaga','Copenhagen',6],
  ['DXB','Dubajus','Dubai',31],['KUT','Kutaisis','Kutaisi',14],['SUF','Lamezija','Lamezia',20],
  ['DUB','Dublinas','Dublin',9],['TLL','Talinas','Tallinn',3],['AMS','Amsterdamas','Amsterdam',8],
  ['MUC','Miunchenas','Munich',6],['VIE','Viena','Vienna',7],['PRG','Praha','Prague',6],
  ['TFS','Tenerifė','Tenerife',23],['RMF','Marsa Alamas','Marsa Alam',26]
].map(([iata,name_lt,name_en,temp])=>({iata,name_lt,name_en,temp}));

const TABLES=['airlines','destinations','flights','overrides','settings'];
const PK={airlines:'id',destinations:'iata',flights:'id',overrides:'key',settings:'key'};

const CFG=(()=>{ let c={url:SUPABASE_URL,key:SUPABASE_ANON_KEY};
  try{const s=JSON.parse(localStorage.getItem('fids_cfg')||'{}'); if(!c.url&&s.url&&s.key) c=s;}catch(e){}
  return c; })();
const sb=(CFG.url&&CFG.key&&window.supabase)?window.supabase.createClient(CFG.url,CFG.key):null;

const store={data:{airlines:[],destinations:[],flights:[],overrides:[],settings:{},ready:false,error:null},ls:new Set(),
  emit(){this.ls.forEach(l=>l(this.data));}, subscribe(l){this.ls.add(l); return ()=>this.ls.delete(l);}};
function setData(raw,error){
  const settings={}; (raw.settings||[]).forEach(s=>settings[s.key]=s.value);
  store.data={airlines:raw.airlines||[],destinations:raw.destinations||[],flights:raw.flights||[],overrides:raw.overrides||[],settings,raw,ready:true,error:error||null};
  store.emit();
}
function useData(){ const [d,setD]=useState(store.data); useEffect(()=>store.subscribe(setD),[]); return d; }

const LKEY='fids_local_db';
const emptyDb=()=>({airlines:[],destinations:DEST_SEED.map(x=>({...x})),flights:[],overrides:[],settings:[]});
const lread=()=>{ try{return JSON.parse(localStorage.getItem(LKEY))||null;}catch(e){return null;} };
let bc=null;
function lwrite(db){ localStorage.setItem(LKEY,JSON.stringify(db)); bc&&bc.postMessage('x'); setData(db); }

const api={
  async load(){
    if(sb){
      const res=await Promise.all(TABLES.map(t=>sb.from(t).select('*')));
      const raw={}; let err=null;
      TABLES.forEach((t,i)=>{ if(res[i].error){err=t+': '+res[i].error.message;} raw[t]=res[i].data||[]; });
      setData(raw,err);
    } else {
      let db=lread(); if(!db){db=emptyDb(); localStorage.setItem(LKEY,JSON.stringify(db));}
      setData(db);
    }
  },
  async upsertMany(table,rows){
    if(!rows.length) return;
    if(sb){
      const {error}=await sb.from(table).upsert(rows,{onConflict:PK[table]});
      if(error) throw error; await api.load();
    } else {
      const db=lread()||emptyDb(); const pk=PK[table];
      rows.forEach(r=>{ r={...r}; if(r[pk]==null) r[pk]=uuid();
        const i=db[table].findIndex(x=>x[pk]===r[pk]);
        if(i>=0) db[table][i]={...db[table][i],...r}; else db[table].push(r); });
      lwrite(db);
    }
  },
  upsert(table,row){ return api.upsertMany(table,[row]); },
  async remove(table,val){
    if(sb){ const {error}=await sb.from(table).delete().eq(PK[table],val); if(error) throw error; await api.load(); }
    else { const db=lread()||emptyDb(); db[table]=db[table].filter(x=>x[PK[table]]!==val); lwrite(db); }
  },
  setSetting(key,value){ return api.upsert('settings',{key,value}); },
  /* Jau įkeltą logotipą (URL) apkarpo ir įkelia iš naujo */
  async retrimUrl(url){
    const blob=await (await fetch(url)).blob();
    const f=new File([blob],'logo.'+((blob.type.split('/')[1]||'png').replace('jpeg','jpg')),{type:blob.type||'image/png'});
    return api.uploadLogo(f,true);
  },
  async uploadLogo(file,trim=true){
    if(trim){ try{ file=await trimImage(file); }catch(e){ console.warn('Apkarpyti nepavyko:',e); } }
    if(sb){
      const ext=(file.name.split('.').pop()||'png').toLowerCase();
      const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const {error}=await sb.storage.from('logos').upload(path,file,{upsert:true,contentType:file.type});
      if(!error) return sb.storage.from('logos').getPublicUrl(path).data.publicUrl;
      console.warn('Storage klaida, saugoma kaip base64:',error.message);
    }
    return await new Promise((ok,no)=>{const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=no; r.readAsDataURL(file);});
  }
};

if(sb){
  let to=null; const deb=()=>{clearTimeout(to); to=setTimeout(()=>api.load(),250);};
  sb.channel('fids-all').on('postgres_changes',{event:'*',schema:'public'},deb).subscribe();
  setInterval(()=>api.load(),60000);
} else {
  try{ bc=new BroadcastChannel('fids'); bc.onmessage=()=>setData(lread()||emptyDb()); }catch(e){}
  window.addEventListener('storage',e=>{ if(e.key===LKEY) setData(lread()||emptyDb()); });
}
api.load();

/* =========================================================
   5. LOGIKA: skrydžių praturtinimas ir parinkimas
   ========================================================= */
function enrich(f,data,now){
  const al=data.airlines.find(a=>a.id===f.airline_id)||null;
  const de=data.destinations.find(d=>d.iata===f.dest_iata)||{iata:f.dest_iata||'',name_lt:f.dest_iata||'',name_en:f.dest_iata||''};
  const day=f.flight_date?dayDiff(now.date,f.flight_date):0;
  const sched=toMin(f.sched_time)||0; let est=toMin(f.est_time);
  if(est!=null&&est<sched-720) est+=1440;
  const rel=day*1440+sched, relEff=day*1440+(est!=null?est:sched);
  let status=f.status||'scheduled', stime=f.status_time||'';
  if(f.auto&&status!=='cancelled'){
    const om=toMin(f.checkin_open); let openRel=null;
    if(om!=null){ openRel=day*1440+om; if(openRel>relEff) openRel-=1440; }
    const a=autoStatus(relEff-now.mins,relEff,openRel,now.mins); status=a.s; stime=a.t||''; }
  if(status==='checkin_soon'&&!stime) stime=fromMin(relEff-150);
  if(status==='departed'&&!stime) stime=fromMin(relEff);
  const delayed=est!=null&&f.est_time&&f.est_time.slice(0,5)!==String(f.sched_time).slice(0,5);
  return {...f,sched_time:String(f.sched_time||'').slice(0,5),est_time:f.est_time?String(f.est_time).slice(0,5):null,al,de,day,rel,relEff,status,stime,delayed};
}
function boardList(data,now){
  return data.flights.filter(f=>!f.hidden&&f.flight_date).map(f=>enrich(f,data,now)).filter(f=>{
    if(f.day<-1||f.day>1) return false;
    if(f.status==='departed') return f.relEff-now.mins>-20;
    if(f.status==='cancelled') return f.rel-now.mins>-20;
    return f.relEff-now.mins>-180;
  }).sort((a,b)=>a.rel-b.rel||String(a.flight_no).localeCompare(b.flight_no));
}
const getOv=(data,key)=>data.overrides.find(o=>o.key===key)||null;
function pickGate(data,now,gate){
  const G=String(gate).toUpperCase(); const ov=getOv(data,'gate:'+G);
  if(ov&&ov.mode==='off') return {cur:null,next:null,ov};
  const list=boardList(data,now).filter(f=>String(f.gate||'').toUpperCase()===G&&f.status!=='departed'&&f.status!=='cancelled');
  let cur=null;
  if(ov&&ov.mode==='flight'&&ov.flight_id){ const f=data.flights.find(x=>x.id===ov.flight_id); if(f) cur=enrich(f,data,now); }
  if(!cur) cur=list.find(f=>GATE_PHASE.has(f.status))||list[0]||null;
  if(cur&&!(ov&&ov.mode==='flight')&&!GATE_PHASE.has(cur.status)&&cur.relEff-now.mins>180){ return {cur:null,next:cur,ov}; }
  const next=cur?list.find(f=>f.id!==cur.id&&f.rel>=cur.rel)||null:null;
  return {cur,next,ov};
}
function pickDesk(data,now,desk){
  const D=String(desk).toUpperCase(); const ov=getOv(data,'desk:'+D);
  if(ov&&ov.mode==='off') return {cur:null,ov};
  if(ov&&ov.mode==='flight'&&ov.flight_id){ const f=data.flights.find(x=>x.id===ov.flight_id); if(f) return {cur:enrich(f,data,now),ov}; }
  const pr={checkin:0,delayed:1,checkin_closed:2,checkin_soon:3};
  const list=boardList(data,now).filter(f=>expandList(f.desks).includes(D)&&DESK_PHASE.has(f.status))
    .sort((a,b)=>pr[a.status]-pr[b.status]||a.rel-b.rel);
  let cur=list[0]||null;
  if(cur&&cur.status==='checkin_soon'){ const o=toMin(cur.stime); if(o!=null&&(cur.day*1440+o)-now.mins>120) cur=null; }
  return {cur,ov};
}

/* =========================================================
   6. BAZINIAI KOMPONENTAI
   ========================================================= */
function Stage({w,h,children}){
  const fit=()=>{const sc=Math.min(innerWidth/w,innerHeight/h); return {sc,x:(innerWidth-w*sc)/2,y:(innerHeight-h*sc)/2};};
  const [s,setS]=useState(fit);
  useEffect(()=>{const f=()=>setS(fit()); addEventListener('resize',f); return ()=>removeEventListener('resize',f);},[w,h]);
  return <div className="stage" style={{width:w,height:h,transform:`translate(${s.x}px,${s.y}px) scale(${s.sc})`}}>{children}</div>;
}

/* Vienas sluoksnis: jei tekstas netelpa – praslenka */
function Layer({text,show,k,a}){
  const box=useRef(),inner=useRef(); const [d,setD]=useState(0);
  const measure=useCallback(()=>{const b=box.current,i=inner.current; if(!b||!i) return; const ov=i.offsetWidth-b.clientWidth; setD(ov>1?Math.ceil(ov)+6:0);},[]);
  useLayoutEffect(()=>{ measure(); if(document.fonts) document.fonts.ready.then(measure); },[text,k,measure]);
  const st=d?{'--d':(-d)+'px',animation:`mq ${((LANG_MS/1000-1.6)/MQ_PASSES).toFixed(2)}s linear .9s ${MQ_PASSES} both`}:undefined;
  return <div ref={box} className={'layer'+(show?'':' hide')} style={{justifyContent:d?'flex-start':a}}>
    <span ref={inner} key={k} className="mq" style={st}>{text}</span>
  </div>;
}
const ALIGN={left:'flex-start',center:'center',right:'flex-end'};
/* Dvikalbis tekstas: LT išnyksta → EN atsiranda, kas LANG_MS (25 s) */
function Bi({lt,en,align='left',style,className=''}){
  const cycle=useTicker(LANG_MS); const a=ALIGN[align]||align;
  const t1=lt==null?'':String(lt), t2=en==null?null:String(en);
  if(t2==null||t2===t1) return <div className={'bi '+className} style={style}><Layer text={t1} show k={cycle} a={a}/></div>;
  const ph=cycle%2;
  return <div className={'bi '+className} style={style}>
    <Layer text={t1} show={ph===0} k={Math.floor(cycle/2)} a={a}/>

/* Logotipo paraščių nukirpimas: nuima vienodos spalvos (baltą) arba permatomą rėmą aplink logotipą */
function trimImage(file,tol=28){
  return new Promise((ok,no)=>{
    if(!/^image\//.test(file.type)||/svg/.test(file.type)) return ok(file);
    const url=URL.createObjectURL(file); const img=new Image();
    img.onerror=()=>{URL.revokeObjectURL(url); no(new Error('Netinkamas paveikslėlis'));};
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const W=img.naturalWidth,H=img.naturalHeight; const c=document.createElement('canvas'); c.width=W; c.height=H;
      const x=c.getContext('2d'); x.drawImage(img,0,0); const px=x.getImageData(0,0,W,H).data;
      const at=(i,j)=>{const k=(j*W+i)*4; return [px[k],px[k+1],px[k+2],px[k+3]];};
      // fono spalva – dažniausia iš 4 kampų
      const corners=[at(0,0),at(W-1,0),at(0,H-1),at(W-1,H-1)];
      const near=(a,b)=>(a[3]<20&&b[3]<20)||(Math.abs(a[0]-b[0])<=tol&&Math.abs(a[1]-b[1])<=tol&&Math.abs(a[2]-b[2])<=tol&&Math.abs(a[3]-b[3])<=tol);
      const bg=corners.map(cc=>[cc,corners.filter(o=>near(cc,o)).length]).sort((a,b)=>b[1]-a[1])[0][0];
      const isBg=(i,j)=>{const p=at(i,j); return p[3]<20||near(p,bg);};
      let top=0,bot=H-1,lef=0,rig=W-1;
      const rowBg=j=>{for(let i=0;i<W;i++) if(!isBg(i,j)) return false; return true;};
      const colBg=i=>{for(let j=top;j<=bot;j++) if(!isBg(i,j)) return false; return true;};
      while(top<bot&&rowBg(top)) top++;
      while(bot>top&&rowBg(bot)) bot--;
      while(lef<rig&&colBg(lef)) lef++;
      while(rig>lef&&colBg(rig)) rig--;
      const w=rig-lef+1,h=bot-top+1;
      if(w<4||h<4||(w===W&&h===H)) return ok(file);
      const o=document.createElement('canvas'); o.width=w; o.height=h;
      o.getContext('2d').drawImage(c,lef,top,w,h,0,0,w,h);
      o.toBlob(b=>b?ok(new File([b],'logo.png',{type:'image/png'})):ok(file),'image/png');
    };
    img.src=url;
  });
}

/* Logotipo kraštų spalvos (kad juosta šonuose būtų tokios pat spalvos kaip logotipo fonas) */
const edgeCache={};
function useEdgeColors(src){
  const [c,setC]=useState(()=>src&&edgeCache[src]||null);
  useEffect(()=>{ if(!src) return; if(edgeCache[src]){setC(edgeCache[src]); return;}
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>{ try{
      const W=img.naturalWidth,H=img.naturalHeight,cv=document.createElement('canvas'); cv.width=W; cv.height=H;
      const x=cv.getContext('2d'); x.drawImage(img,0,0);
      const avg=col=>{ let r=0,g=0,b=0,n=0; for(let j=0;j<H;j+=Math.max(1,H>>4)){ const p=x.getImageData(col,j,1,1).data; if(p[3]<20){r+=255;g+=255;b+=255;} else {r+=p[0];g+=p[1];b+=p[2];} n++; } return `rgb(${r/n|0},${g/n|0},${b/n|0})`; };
      const v={l:avg(0),r:avg(W-1)}; edgeCache[src]=v; setC(v);
    }catch(e){ edgeCache[src]={l:'#fff',r:'#fff'}; setC(edgeCache[src]); } };
    img.onerror=()=>{ edgeCache[src]={l:'#fff',r:'#fff'}; setC(edgeCache[src]); };
    img.src=src; },[src]);
  return c;
}

function wxKind(code,isDay){
  if(code==null) return null;
  if(code===0) return isDay?'sun':'moon';
  if(code<=2) return isDay?'sunCloud':'moonCloud';
  if(code===3) return 'cloud';
  if(code===45||code===48) return 'fog';
  if((code>=51&&code<=57)||(code>=61&&code<=67)||(code>=80&&code<=82)) return (code>=80&&isDay)?'sunRain':'rain';
  if((code>=71&&code<=77)||code===85||code===86) return 'snow';
  if(code>=95) return 'storm';
  return 'cloud';
}

const WX_TTL=15*60*1000; const wxMem={}; const wxWait={};
async function geoFor(de){
  if(de.lat!=null&&de.lon!=null&&de.lat!==''&&de.lon!=='') return [+de.lat,+de.lon];
  if(COORDS[de.iata]) return COORDS[de.iata];
  const k='geo_'+de.iata; try{ const c=JSON.parse(localStorage.getItem(k)); if(c) return c; }catch(e){}
  const q=de.name_en||de.name_lt; if(!q) return null;
  const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&name='+encodeURIComponent(q)).then(r=>r.json());
  const g=r&&r.results&&r.results[0]; if(!g) return null;
  const c=[g.latitude,g.longitude]; try{localStorage.setItem(k,JSON.stringify(c));}catch(e){} return c;
}
async function fetchWx(de){
  const key='wx_'+de.iata;
  const mem=wxMem[key]; if(mem&&Date.now()-mem.t<WX_TTL) return mem;
  try{ const ls=JSON.parse(localStorage.getItem(key)); if(ls&&Date.now()-ls.t<WX_TTL){ wxMem[key]=ls; return ls; } }catch(e){}
  if(wxWait[key]) return wxWait[key];
  wxWait[key]=(async()=>{
    try{
      const c=await geoFor(de); if(!c) return null;
      const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c[0]}&longitude=${c[1]}&current=temperature_2m,weather_code,is_day&timezone=auto`).then(r=>r.json());
      if(!r||!r.current) return null;
      const v={t:Date.now(),temp:Math.round(r.current.temperature_2m),code:r.current.weather_code,day:!!r.current.is_day};
      wxMem[key]=v; try{localStorage.setItem(key,JSON.stringify(v));}catch(e){} return v;
    }catch(e){ return (wxMem[key]||null); }
    finally{ delete wxWait[key]; }
  })();
  return wxWait[key];
}
/* Grąžina {temp, kind}. Rankinė temperatūra krypčių lentelėje naudojama tik jei internetu gauti nepavyko arba įjungtas rankinis režimas */
function useWeather(de){
  const tick=useTicker(5*60*1000);
  const [w,setW]=useState(null);
  const manual=de&&de.wx_manual;
  useEffect(()=>{ let ok=true; if(!de||!de.iata||manual){ setW(null); return; } fetchWx(de).then(v=>{ if(ok) setW(v); }); return ()=>{ok=false;}; },[de&&de.iata,de&&de.lat,de&&de.lon,de&&de.name_en,manual,tick]);
  if(!de) return null;
  if(w&&!manual) return {temp:w.temp,kind:wxKind(w.code,w.day)};
  if(de.temp!=null&&de.temp!=='') return {temp:de.temp,kind:de.wx_icon||null};
  return null;
}

const IMP_COLS=[

  ['airline','Oro linija',['oro linija','oro linijos','airline','al','vezejas','vežėjas','carrier','kodas','oro_linija']],

  ['gate','Vartai',['vartai','gate','gates']],
  ['status','Būsena',['busena','būsena','status']],
];
const IMP_DEFAULT_ORDER=['flight_no','airline','dest','date','sched','est','desks','gate','status'];
const normH=x=>String(x??'').trim().toLowerCase().replace(/[ąčęėįšųūž]/g,c=>({ą:'a',č:'c',ę:'e',ė:'e',į:'i',š:'s',ų:'u',ū:'u',ž:'z'}[c])).replace(/\s+/g,' ');
const ST_ALIASES=(()=>{ const m={}; STATUSES.forEach(([k,lt,en])=>{ m[k]=k; m[normH(lt.replace(' {t}',''))]=k; m[normH(en.replace(' {t}',''))]=k; });
  Object.assign(m,{'auto':'__auto','':'__auto','registracija':'checkin_soon','laipinimas':'boarding','pask. kvietimas':'final_call','paskutinis kvietimas':'final_call','last call':'final_call','iskrido':'departed','atsauktas':'cancelled','cancelled':'cancelled','canceled':'cancelled','veluoja':'delayed','delayed':'delayed','laiku':'__auto','on time':'__auto','registracija pradedama':'checkin_soon','check-in opens':'checkin_soon'}); return m; })();

function parseTimeCell(v){
  if(v==null||v==='') return null;
  if(typeof v==='number'){ if(v>=0&&v<1){ return fromMin(Math.round(v*1440)); } if(v>=1&&v<100000&&v%1){ return fromMin(Math.round((v%1)*1440)); } }
  if(v instanceof Date) return pad(v.getHours())+':'+pad(v.getMinutes());
  const s=String(v).trim(); let m=s.match(/(\d{1,2})[:.h](\d{2})/); if(m&&+m[1]<24&&+m[2]<60) return pad(+m[1])+':'+m[2];
  m=s.match(/^(\d{3,4})$/); if(m){ const t=m[1].padStart(4,'0'); if(+t.slice(0,2)<24&&+t.slice(2)<60) return t.slice(0,2)+':'+t.slice(2); }
  return undefined; // klaida
}
function parseDateCell(v,fallback){
  if(v==null||v==='') return fallback;
  if(typeof v==='number'&&v>20000&&v<80000){ return new Date(Date.UTC(1899,11,30)+Math.floor(v)*864e5).toISOString().slice(0,10); }
  if(v instanceof Date) return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if((m=s.match(/^(\d{1,2})[-./](\d{1,2})[-./](\d{4})/))) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  if((m=s.match(/^(\d{1,2})[-./](\d{1,2})[-./](\d{2})$/))) return `20${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  if((m=s.match(/^(\d{1,2})[-./](\d{1,2})$/))) return `${String(fallback).slice(0,4)}-${pad(+m[2])}-${pad(+m[1])}`;
  if(/^(siandien|šiandien|today)$/i.test(s)) return vnow().date;
  if(/^(rytoj|tomorrow)$/i.test(s)) return addDays(vnow().date,1);
  return undefined;
}
/* Tekstas → eilučių masyvas (tab, ; arba , skyrikliai, kabutės) */
function parseDelimited(txt){
  txt=String(txt||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n').trim(); if(!txt) return [];
  const first=txt.split('\n')[0];
  const cnt=ch=>(first.match(new RegExp('\\'+ch,'g'))||[]).length;
  const del=cnt('\t')?'\t':(cnt(';')>=cnt(',')&&cnt(';'))?';':',';
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){ const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"'&&cell==='') q=true;
    else if(c===del){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c; }
  row.push(cell); rows.push(row);
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function buildImport(rows,data,defDate){
  if(!rows.length) return {items:[],map:{}};
  // antraštė?
  const head=rows[0].map(normH); const map={};
  IMP_COLS.forEach(([k,,al])=>{ const i=head.findIndex(h=>al.some(a=>h===normH(a)||h.startsWith(normH(a)))); if(i>=0&&!Object.values(map).includes(i)) map[k]=i; });
  let body=rows;
  if(Object.keys(map).length>=2&&('flight_no' in map||'sched' in map)) body=rows.slice(1);
  else { Object.keys(map).forEach(k=>delete map[k]); IMP_DEFAULT_ORDER.forEach((k,i)=>{ if(i<rows[0].length) map[k]=i; }); }
  const get=(r,k)=>map[k]==null?'':r[map[k]];
  const items=body.map((r,idx)=>{
    const errs=[],warn=[];
    const no=String(get(r,'flight_no')??'').toUpperCase().replace(/\s+/g,'');
    if(!no) errs.push('nėra skrydžio nr.');
    let alRaw=String(get(r,'airline')??'').trim();
    let alCode=(alRaw||no.match(/^([A-Z0-9]{2})/)?.[1]||'').toUpperCase();
    let al=data.airlines.find(a=>String(a.code).toUpperCase()===alCode)||data.airlines.find(a=>normH(a.name)===normH(alRaw));
    if(!al&&alCode) warn.push(`nauja oro linija ${alCode}`);
    const destRaw=String(get(r,'dest')??'').trim();
    let dm=destRaw.match(/\b([A-Z]{3})\b/); let iata=dm?dm[1]:destRaw.toUpperCase().slice(0,3);
    let de=data.destinations.find(d=>d.iata===iata)||data.destinations.find(d=>normH(d.name_lt)===normH(destRaw)||normH(d.name_en)===normH(destRaw));
    if(de) iata=de.iata; else if(destRaw) warn.push(`nauja kryptis ${iata}`); else errs.push('nėra krypties');
    const date=parseDateCell(get(r,'date'),defDate); if(date===undefined) errs.push('bloga data');
    const sched=parseTimeCell(get(r,'sched')); if(!sched) errs.push('blogas laikas');
    const est=parseTimeCell(get(r,'est')); if(est===undefined) warn.push('neatpažintas patikslintas laikas');
    const stFull=String(get(r,'status')??''); const stT=(stFull.match(/(\d{1,2})[:.](\d{2})/)||null);
    const stTime=stT?pad(+stT[1])+':'+stT[2]:null;
    const stRaw=normH(stFull.replace(/(\d{1,2})[:.](\d{2})/,'')).trim(); let status=ST_ALIASES[stRaw]; let checkinOpen=null, stTimeOut=null;
    if(status===undefined){ warn.push('neatpažinta būsena → auto'); status='__auto'; }
    if(status==='checkin_soon'){ if(stTime){ status='__auto'; checkinOpen=stTime; } }
    else if(status!=='__auto') stTimeOut=stTime;
    const ex=data.flights.find(f=>String(f.flight_no).toUpperCase()===no&&String(f.flight_date).slice(0,10)===date);
    return {idx:idx+1,no,alCode,alName:alRaw&&alRaw.toUpperCase()!==alCode?alRaw:'',al,iata,destRaw,de,date,sched,est:est||null,
      desks:String(get(r,'desks')??'').trim(),gate:String(get(r,'gate')??'').trim().toUpperCase(),status,checkinOpen,stTimeOut,ex,errs,warn};
  });
  return {items,map};
}

function ImportFlights({data,defDate,onClose}){
  const [txt,setTxt]=useState(''); const [busy,setBusy]=useState(false);
  const [mode,setMode]=useState('update'); const [msg,setMsg]=useState('');
  const {items}=buildImport(parseDelimited(txt),data,defDate);
  const ok=items.filter(i=>!i.errs.length);
  const doImport=async()=>{
    if(!ok.length) return; setBusy(true); setMsg('');
    try{
      const newAl={}; ok.forEach(i=>{ if(!i.al&&i.alCode&&!newAl[i.alCode]) newAl[i.alCode]={id:uuid(),code:i.alCode,name:i.alName||i.alCode,color:'#444444'}; });
      if(Object.keys(newAl).length) await api.upsertMany('airlines',Object.values(newAl));
      const newDe={}; ok.forEach(i=>{ if(!i.de&&i.iata&&!newDe[i.iata]){ const nm=i.destRaw.replace(/\b[A-Z]{3}\b/,'').trim()||i.iata; newDe[i.iata]={iata:i.iata,name_lt:nm,name_en:nm}; } });
      if(Object.keys(newDe).length) await api.upsertMany('destinations',Object.values(newDe));
      const fl=ok.filter(i=>!(mode==='skip'&&i.ex)).map(i=>{
        const base=(mode==='update'&&i.ex)?{id:i.ex.id}:{id:uuid()};
        const auto=i.status==='__auto';
        return {...base,flight_no:i.no,airline_id:(i.al&&i.al.id)||(newAl[i.alCode]&&newAl[i.alCode].id)||null,dest_iata:i.iata||null,
          flight_date:i.date,sched_time:i.sched,est_time:i.est,desks:i.desks||null,gate:i.gate||null,
          status:auto?((mode==='update'&&i.ex&&i.ex.status)||'scheduled'):i.status,auto:auto?((mode==='update'&&i.ex)?!!i.ex.auto:true):false,
          status_time:auto?null:(i.stTimeOut||((i.status==='departed')?(i.est||i.sched):null)),
          checkin_open:i.checkinOpen||((mode==='update'&&i.ex)?(i.ex.checkin_open||null):null),hidden:false};
      });
      for(let k=0;k<fl.length;k+=200) await api.upsertMany('flights',fl.slice(k,k+200));
      setMsg(`Importuota ${fl.length} skrydž.${Object.keys(newAl).length?`, naujų oro linijų: ${Object.keys(newAl).length}`:''}${Object.keys(newDe).length?`, naujų krypčių: ${Object.keys(newDe).length}`:''}.`);
      setTxt('');
    }catch(e){ setMsg('Klaida: '+e.message); }
    setBusy(false);
  };
  return <div className="card" style={{borderColor:'#ffc20e55'}}>
    <div className="row" style={{marginBottom:8}}><h3 style={{margin:0}}>Skrydžių importas (CSV tekstas)</h3><span style={{flex:1}}/>
      <button className="btn" onClick={onClose}>Uždaryti ✕</button></div>
    <div className="row" style={{alignItems:'stretch'}}>
      <div style={{flex:1,minWidth:340}}>
        <div className="muted" style={{marginBottom:4}}>Įklijuok čia:</div>
        <textarea value={txt} onChange={e=>setTxt(e.target.value)} spellCheck={false}
          style={{width:'100%',height:170,background:'#1d1d1d',color:'#eee',border:'1px solid #3a3a3a',borderRadius:6,padding:8,fontFamily:'monospace',fontSize:12}}/>
      </div>
      <div style={{flex:1,minWidth:340}}>
        <div className="row" style={{justifyContent:'space-between',marginBottom:4}}><span className="muted">Pavyzdys, kaip turi atrodyti:</span>
          <button className="btn" style={{padding:'2px 8px',fontSize:12}} onClick={()=>setTxt(IMP_EXAMPLE(defDate))}>Įterpti pavyzdį</button></div>
        <pre style={{margin:0,height:170,overflow:'auto',background:'#0c0c0c',border:'1px solid #2a2a2a',borderRadius:6,padding:8,fontSize:12,color:'#cfc'}}>{IMP_EXAMPLE(defDate)}</pre>
      </div>
    </div>
    <div className="muted" style={{marginTop:8,lineHeight:1.6}}>
      Pirma eilutė – antraštės, skyriklis <b>;</b> (tinka ir kablelis ar tab). Privaloma: <b>skrydis</b>, <b>kryptis</b> (IATA), <b>laikas</b> (HH:MM).
      Neprivaloma: <b>oro_linija</b> (kodas; jei tuščia – imama iš skrydžio nr.), <b>data</b> (YYYY-MM-DD arba DD.MM.YYYY; tuščia → {defDate}),
      <b>patikslintas</b>, <b>registracija</b> (pvz. 13-14), <b>vartai</b>, <b>busena</b> (tuščia, „auto“ arba „LAIKU“ – automatinis režimas; „REGISTRACIJA PRADEDAMA 05:35“ – auto su registracijos pradžia 05:35; arba REGISTRUOJAMA, LAIPINAMA, PASK. KVIETIMAS, VARTAI UŽDARYTI, ATŠAUKTAS…).
    </div>
    <div className="row" style={{marginTop:8}}>
      <span className="muted">Jei skrydis (nr. + data) jau yra:</span>
      <select value={mode} onChange={e=>setMode(e.target.value)}><option value="update">atnaujinti esamą</option><option value="skip">praleisti</option><option value="dup">kurti naują</option></select>
    </div>
    {items.length>0&&<>
      <p className="muted" style={{margin:'8px 0'}}>Tinkamų: <b style={{color:'#9f9'}}>{ok.length}</b> / {items.length}{items.length-ok.length?<> · su klaidomis: <b style={{color:'#f77'}}>{items.length-ok.length}</b> (nebus importuoti)</>:null}</p>
      <div style={{maxHeight:320,overflow:'auto'}}><table className="tbl"><thead><tr><th>#</th><th>Skrydis</th><th>Oro linija</th><th>Kryptis</th><th>Data</th><th>Laikas</th><th>Patiksl.</th><th>Registr.</th><th>Vartai</th><th>Būsena</th><th>Pastabos</th></tr></thead><tbody>
        {items.map(i=><tr key={i.idx} style={{background:i.errs.length?'#3a1414':i.warn.length?'#2e2a12':undefined}}>
          <td>{i.idx}</td><td>{i.no}</td><td>{i.al?i.al.code:i.alCode}</td><td>{i.iata}{i.de?<span className="muted"> {i.de.name_lt}</span>:null}</td><td>{i.date||'—'}</td><td>{i.sched||'—'}</td><td>{i.est||''}</td><td>{i.desks}</td><td>{i.gate}</td>
          <td>{i.status==='__auto'?(i.checkinOpen?`auto · reg. nuo ${i.checkinOpen}`:'auto'):((ST[i.status]||{}).lt||'').replace('{t}',i.stTimeOut||'').trim()}</td>
          <td style={{fontSize:12}}>{i.ex&&<span style={{color:'#7cc4ff'}}>{mode==='update'?'atnaujins':mode==='skip'?'praleis':'dublikatas'} · </span>}<span style={{color:'#f77'}}>{i.errs.join(', ')}</span>{i.errs.length&&i.warn.length?' · ':''}<span style={{color:'#ec5'}}>{i.warn.join(', ')}</span></td>
        </tr>)}
      </tbody></table></div>
      <div className="row" style={{marginTop:10}}><button className="btn pri" disabled={busy||!ok.length} onClick={doImport}>{busy?'Importuojama…':`Importuoti ${ok.length} skrydž.`}</button></div>
    </>}
    {msg&&<p style={{color:msg.startsWith('Klaida')?'#f77':'#9f9'}}>{msg}</p>}
  </div>;
}

function FlightsTab({data}){
  const today=vnow().date;
  const [date,setDate]=useState(today); const [all,setAll]=useState(false); const [adding,setAdding]=useState(false); const [imp,setImp]=useState(false);

    .sort((a,b)=>String(a.flight_date).localeCompare(String(b.flight_date))||String(a.sched_time).localeCompare(String(b.sched_time)));
  const copyNext=async()=>{ const src=data.flights.filter(f=>String(f.flight_date).slice(0,10)===date); if(!src.length) return;
    if(!confirm(`Nukopijuoti ${src.length} skrydž. į ${addDays(date,1)}?`)) return;
    try{ await api.upsertMany('flights',src.map(f=>({...clean(f,FKEYS),id:uuid(),flight_date:addDays(date,1),est_time:null,status:'scheduled',status_time:null}))); setDate(addDays(date,1)); }catch(e){errAlert(e);} };

      <button className="btn" onClick={()=>setDate(addDays(date,1))}>▶</button>
      <button className="btn" onClick={()=>setDate(today)}>Šiandien</button>
      <label className="row" style={{gap:4}}><input type="checkbox" checked={all} onChange={e=>setAll(e.target.checked)}/>visos dienos</label>
      <span style={{flex:1}}/>
      <button className="btn" onClick={copyNext}>Kopijuoti dieną → rytojų</button>
      <button className="btn" onClick={()=>setImp(v=>!v)}>⤒ Importuoti</button>
      <button className="btn pri" onClick={()=>setAdding(true)}>+ Naujas skrydis</button>
    </div>
    {imp&&<ImportFlights data={data} defDate={date} onClose={()=>setImp(false)}/>}
    <div style={{overflowX:'auto'}}>
    <table className="tbl"><thead><tr><th>Data</th><th>Skrydis</th><th>Oro linija</th><th>Kryptis</th><th>Laikas</th><th>Patiksl.</th><th>Registr.</th><th>Vartai</th><th>Būsena</th><th>Slėpti</th><th></th></tr></thead>
    <tbody>
      {adding&&<FlightRow isNew data={data} f={{flight_date:date,flight_no:'',sched_time:'',status:'scheduled',auto:true,hidden:false}} onDone={()=>setAdding(false)}/>}
      {flights.map(f=><FlightRow key={f.id} f={f} data={data}/>)}
      {!flights.length&&!adding&&<tr><td colSpan={11} className="muted" style={{padding:20}}>Šiai dienai skrydžių nėra.</td></tr>}
    </tbody></table></div>
    <p className="muted">„auto“ – būsena keičiasi pati: registracija prasideda likus 2:30 val., baigiasi likus 40 min., vartai atidaromi −40, laipinama −30, pask. kvietimas −15, vartai uždaromi −10. Greiti mygtukai išjungia „auto“.</p>
  </div>;
}

  const A=[['AY','Finnair','#0b1560'],['FR','Ryanair','#073590'],['W6','Wizz Air','#c6007e'],['HN','Heston Airlines','#e8462a'],['TK','Turkish Airlines','#c8102e'],['QU','SkyLine Express','#c98a12'],['BT','airBaltic','#9cc31a']]
    .map(([code,name,color])=>({id:uuid(),code,name,color,header_bg:'#ffffff'}));
  const al=c=>A.find(a=>a.code===c).id;
  const F=[['AY1108','AY','HEL',0,'16-18','A2'],['FR542','FR','BER',5,'13-14','A1'],['W61933','W6','BUD',5,'14-15','A16'],['HN2321','HN','SSH',10,'6-9','B10'],['W63969','W6','LCA',50,'4-5','B13'],['FR1501','FR','OSL',90,'13-14','B11'],['TK1408','TK','IST',100,'10-12','B7'],['QU7023','QU','HRG',100,'28-30','B9',70],['BT969','BT','RIX',110,'4-5','A4']];
  const flights=F.map(([no,c,d,off,desks,gate,delay])=>{ const m=base+off; return {id:uuid(),flight_no:no,airline_id:al(c),dest_iata:d,flight_date:addDays(n.date,Math.floor(m/1440)),sched_time:fromMin(m),est_time:delay?fromMin(m+delay):null,gate,desks,status:'scheduled',status_time:null,auto:true,hidden:false}; });
  await api.upsertMany('destinations',DEST_SEED);
  await api.upsertMany('airlines',A);
  await api.upsertMany('flights',flights);
}

function SettingsTab({data}){
  const s=data.settings;
  const [f,setF]=useState({airport_name:s.airport_name||'Vilniaus oro uostas',airport_sub:s.airport_sub||'LIETUVOS ORO UOSTAI',gate_list:s.gate_list||'A1-A17,B1-B14',desk_list:s.desk_list||'1-30'});
  const [cfg,setCfg]=useState(()=>{try{return JSON.parse(localStorage.getItem('fids_cfg')||'{}');}catch(e){return {};}});
  const saveAll=async()=>{ try{ await api.upsertMany('settings',Object.entries(f).map(([key,value])=>({key,value}))); alert('Išsaugota'); }catch(e){errAlert(e);} };
  const exp=()=>{ const blob=new Blob([JSON.stringify(data.raw,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='fids-backup.json'; a.click(); };
  const imp=async file=>{ try{ const j=JSON.parse(await file.text()); for(const t of ['destinations','airlines','flights','overrides','settings']) if(j[t]) await api.upsertMany(t,j[t]); alert('Importuota'); }catch(e){errAlert(e);} };
  return <>
    <div className="card"><h3>Oro uostas</h3>
      <div className="row"><label>Pavadinimas <input value={f.airport_name} onChange={e=>setF({...f,airport_name:e.target.value})}/></label>
        <label>Paantraštė <input value={f.airport_sub} onChange={e=>setF({...f,airport_sub:e.target.value})}/></label></div>
      <div className="row" style={{marginTop:8}}><div style={{background:'#1c1c1c',padding:10,fontFamily:'Open Sans',fontWeight:700}}><AirportLogo/></div>
        <LogoInput label="Įkelti oro uosto logotipą" onFile={async file=>{try{await api.setSetting('airport_logo_url',await api.uploadLogo(file));}catch(e){errAlert(e);}}}/>
        {s.airport_logo_url&&<button className="btn del" onClick={()=>api.setSetting('airport_logo_url',null)}>Pašalinti logotipą</button>}</div>
      <div className="row" style={{marginTop:8}}><label>Vartai <input value={f.gate_list} onChange={e=>setF({...f,gate_list:e.target.value})} style={{width:220}}/></label>
        <label>Registracijos stalai <input value={f.desk_list} onChange={e=>setF({...f,desk_list:e.target.value})} style={{width:160}}/></label></div>
      <div style={{marginTop:10}}><button className="btn pri" onClick={saveAll}>Išsaugoti</button></div>
    </div>
    <div className="card"><h3>Duomenys</h3><div className="row">
      <button className="btn" onClick={()=>confirm('Įkelti demo skrydžius (pagal dabartinį laiką)?')&&seedDemo().catch(errAlert)}>Įkelti demo duomenis</button>
      <button className="btn" onClick={exp}>Eksportuoti JSON</button>
      <LogoInput label="Importuoti JSON" onFile={imp}/>
      {!sb&&<button className="btn del" onClick={()=>{ if(confirm('Ištrinti VISUS vietinius duomenis?')){ localStorage.removeItem(LKEY); api.load(); }}}>Išvalyti vietinius duomenis</button>}
    </div></div>
    <div className="card"><h3>Supabase ryšys</h3>
      <p className="muted">Dabar: {sb?'Supabase ('+CFG.url+')':'vietinis demo režimas – duomenys tik šioje naršyklėje'}. {SUPABASE_URL?'URL įrašytas faile – čia nustatymai nenaudojami.':''}</p>
      <div className="row"><input placeholder="https://xxxx.supabase.co" value={cfg.url||''} onChange={e=>setCfg({...cfg,url:e.target.value.trim()})} style={{width:300}}/>
        <input placeholder="anon public key" value={cfg.key||''} onChange={e=>setCfg({...cfg,key:e.target.value.trim()})} style={{width:380}}/>
        <button className="btn pri" onClick={()=>{localStorage.setItem('fids_cfg',JSON.stringify(cfg)); location.reload();}}>Išsaugoti ir perkrauti</button>
        <button className="btn" onClick={()=>{localStorage.removeItem('fids_cfg'); location.reload();}}>Grįžti į vietinį</button></div>
      <p className="muted">Ekranams kituose kompiuteriuose patogiausia URL ir raktą įrašyti failo viršuje (SUPABASE_URL, SUPABASE_ANON_KEY).</p>
    </div>
  </>;
}

function Login(){
  const [e,setE]=useState(''),[p,setP]=useState(''),[err,setErr]=useState('');
  const go=async()=>{ const {error}=await sb.auth.signInWithPassword({email:e,password:p}); if(error) setErr(error.message); };
  return <div className="op-wrap"><div className="card" style={{maxWidth:380,margin:'80px auto',display:'grid',gap:10}}>
    <h2>Operatoriaus prisijungimas</h2>
    <input placeholder="El. paštas" value={e} onChange={x=>setE(x.target.value)}/>
    <input type="password" placeholder="Slaptažodis" value={p} onChange={x=>setP(x.target.value)} onKeyDown={x=>x.key==='Enter'&&go()}/>
    <button className="btn pri" onClick={go}>Prisijungti</button>
    {err&&<div style={{color:'#ff7b7b'}}>{err}</div>}
  </div></div>;
}

function Operator(){
  const data=useData();
  const [session,setSession]=useState(null); const [checked,setChecked]=useState(!sb);
  const [tab,setTab]=useState(()=>localStorage.getItem('fids_tab')||'flights');
  useEffect(()=>{ document.body.classList.add('op'); return ()=>document.body.classList.remove('op'); },[]);
  useEffect(()=>{ if(!sb) return;
    sb.auth.getSession().then(({data})=>{setSession(data.session); setChecked(true);});
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s)); return ()=>sub.subscription.unsubscribe(); },[]);
  useEffect(()=>{ localStorage.setItem('fids_tab',tab); },[tab]);
  useTicker(30000);
  if(!checked) return <div className="op-wrap">Kraunama…</div>;
  if(sb&&!session) return <Login/>;
  const T=[['flights','Skrydžiai'],['airlines','Oro linijos'],['dest','Kryptys'],['screens','Ekranai'],['settings','Nustatymai']];
  const n=vnow();
  return <div className="op-wrap">
    <div className="op-top">
      <h2 style={{margin:0}}>FIDS operatorius</h2>
      <span className={'badge'+(sb?'':' loc')}>{sb?'Supabase':'Vietinis demo'}</span>
      <span className="muted">{n.date} {pad(n.h)}:{pad(n.m)} (Vilnius)</span>
      <span style={{flex:1}}/>
      <div className="tabs">{T.map(([k,l])=><button key={k} className={tab===k?'on':''} onClick={()=>setTab(k)}>{l}</button>)}</div>
      {sb&&<button className="btn" onClick={()=>sb.auth.signOut()}>Atsijungti</button>}
    </div>
    {data.error&&<div className="card" style={{borderColor:'#a33',color:'#f99'}}>Duomenų bazės klaida: {data.error}. Ar paleidai SQL failą?</div>}
    {tab==='flights'&&<FlightsTab data={data}/>}
    {tab==='airlines'&&<AirlinesTab data={data}/>}
    {tab==='dest'&&<DestTab data={data}/>}
    {tab==='screens'&&<ScreensTab data={data}/>}
    {tab==='settings'&&<SettingsTab data={data}/>}
  </div>;
}

function Home(){
  useEffect(()=>{ document.body.style.overflow='auto'; return ()=>{document.body.style.overflow='';}; },[]);
  const l=(p,t)=><a href={'#/'+p}>{t}</a>;
  return <div className="home">
    <h1 style={{marginTop:0}}>Išvykimo informacijos sistema (FIDS)</h1>
    <p>{l('operator','⚙ Operatoriaus pultelis')}</p>
    <h3>Lentos</h3>
    <p>{l('fids','Bendra')}{l('fids/portrait','Bendra (vertikali)')}{l('checkin','Registracijos zona')}{l('checkin/portrait','Registracijos zona (vert.)')}{l('gates','Vartų zona')}{l('gates/portrait','Vartų zona (vert.)')}</p>
    <h3>Pavyzdžiai</h3>
    <p>{l('gate/B9','Vartai B9')}{l('gate/A2','Vartai A2')}{l('desk/28','Stalas 28')}{l('desk/13','Stalas 13')}</p>
    <p style={{color:'#888'}}>Formatas: <code>#/gate/&lt;numeris&gt;</code>, <code>#/desk/&lt;numeris&gt;</code>. Visi ekranų adresai – pultelyje, skiltyje „Ekranai“.</p>
  </div>;
}

/* =========================================================
   11. MARŠRUTAI
   ========================================================= */
function useRoute(){
  const [h,setH]=useState(location.hash);
  useEffect(()=>{ const f=()=>setH(location.hash); addEventListener('hashchange',f); return ()=>removeEventListener('hashchange',f); },[]);
  return h.replace(/^#\/?/,'').split('?')[0].split('/').filter(Boolean).map(decodeURIComponent);
}
function App(){
  const r=useRoute(); const [a,b]=r; const portrait=b==='portrait';
  if(a==='fids') return <Board kind="fids" portrait={portrait}/>;
  if(a==='checkin') return <Board kind="checkin" portrait={portrait}/>;
  if(a==='gates') return <Board kind="gates" portrait={portrait}/>;
  if(a==='gate'&&b) return <GateScreen key={b} gate={b.toUpperCase()}/>;
  if(a==='desk'&&b) return <DeskScreen key={b} desk={b.toUpperCase()}/>;
  if(a==='operator') return <Operator/>;
  return <Home/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
